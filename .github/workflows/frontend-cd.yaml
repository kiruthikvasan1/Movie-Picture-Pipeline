name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yaml'
      - '.github/actions/setup-frontend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: frontend
      EKS_CLUSTER_NAME: cluster

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Get backend service URL
        id: backend
        run: |
          for i in $(seq 1 30); do
            BACKEND_HOST=$(kubectl get service backend \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
              2>/dev/null || true)
            if [ -z "$BACKEND_HOST" ]; then
              BACKEND_HOST=$(kubectl get service backend \
                -o jsonpath='{.status.loadBalancer.ingress[0].ip}' \
                2>/dev/null || true)
            fi
            if [ -n "$BACKEND_HOST" ]; then
              echo "url=http://${BACKEND_HOST}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Backend LoadBalancer is not ready."
          exit 1

      - name: Build and push frontend image
        working-directory: starter/frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          REACT_APP_MOVIE_API_URL: ${{ steps.backend.outputs.url }}
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="$REACT_APP_MOVIE_API_URL" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/frontend \
            frontend="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          kubectl rollout status deployment/frontend --timeout=180s
